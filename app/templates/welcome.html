{% extends "base.html" %}
{% block title %}Choose your avatar · Carls Chat{% endblock %}
{% block content %}
<section class="avatar-page"><p class="eyebrow">NICE TO MEET YOU, {{ username }}</p><h1>Which little Carl are you?</h1><p>Pick your campus companion. You can always change it later.</p>
  <div class="avatar-container"><img src="{{ avatar_path }}" alt="Selected campus avatar" data-current="{{ avatar_path }}"></div>
  <div class="avatar-controls"><button id="left-btn" aria-label="Previous avatar">← Previous</button><span id="avatar-count" aria-live="polite"></span><button id="right-btn" aria-label="Next avatar">Next →</button></div>
  <button class="primary" id="save-btn" data-next="/">Let’s go to campus →</button>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/choose.js" defer></script>{% endblock %}
